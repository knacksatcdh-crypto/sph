<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>SPARK HACK Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top nav → one "window" per topic (overview / 4 sites / 3 challenges / apply); site windows = model viewer + problem list + slide-in problem drawer */
:root{
  --paper:#EEF4F5; --surface:#FFFFFF; --ink:#0E2A33; --muted:#526E77; --line:#D3E1E4;
  --accent:#0A7C8C; --accent-ink:#FFFFFF; --scene:#DCEBEF;
  --ch-id:#D97A06; --ch-sec:#1D6FC9; --ch-res:#2B8F52;
  --warn-bg:#FFF4DE; --warn-ink:#6B4500;
  --ok:#2B8F52; --part:#B7791F; --hypo:#8A6FB0; --sea:#D6E8EE; --land:#FFFFFF; --land2:#E3ECEE; --border2:#9FB5BB;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A181D; --surface:#11242A; --ink:#E2EEF0; --muted:#8EA7AD; --line:#22404A;
  --accent:#3CC2D2; --accent-ink:#06262C; --scene:#0F2229;
  --ch-id:#F2A23C; --ch-sec:#5AA2F0; --ch-res:#55C27F;
  --warn-bg:#2E2410; --warn-ink:#F3D69A; --ok:#55C27F; --part:#E3AE4F; --hypo:#B49BE0; --sea:#0D2128; --land:#1A333B; --land2:#132A31; --border2:#3A5A64; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A181D; --surface:#11242A; --ink:#E2EEF0; --muted:#8EA7AD; --line:#22404A;
  --accent:#3CC2D2; --accent-ink:#06262C; --scene:#0F2229;
  --ch-id:#F2A23C; --ch-sec:#5AA2F0; --ch-res:#55C27F;
  --warn-bg:#2E2410; --warn-ink:#F3D69A; --ok:#55C27F; --part:#E3AE4F; --hypo:#B49BE0; --sea:#0D2128; --land:#1A333B; --land2:#132A31; --border2:#3A5A64; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.65 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px}
.brand{font:700 17px/1 var(--f-display);letter-spacing:.02em;white-space:nowrap;text-decoration:none;color:var(--ink)}
.brand small{display:block;font:500 11px/1.4 var(--f-body);color:var(--muted);letter-spacing:0}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:999px;font-size:14px;display:flex;align-items:center;gap:6px}
.nav a:hover{color:var(--ink);background:var(--surface)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav .sep{width:1px;background:var(--line);margin:4px 4px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:13px;white-space:nowrap}

main{max-width:1240px;margin:0 auto;padding:24px 16px 64px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:10px 14px;font-size:13.5px}

/* overview */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:end;margin-bottom:26px}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:700;letter-spacing:-.01em}
.hero p{color:var(--muted);max-width:60ch;margin:12px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:14px}
.stats b{display:block;font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}
.sites{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 34px}
.site-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.site-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.site-card canvas{width:100%;aspect-ratio:4/3;display:block;max-width:100%}
.site-card .b{padding:12px 14px 14px;display:grid;gap:4px}
.site-card h3{font-size:18px}
.site-card .loc{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid currentColor;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:22px}
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.matrix{border-collapse:collapse;width:100%;min-width:620px}
.matrix th,.matrix td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
.matrix tr:last-child td{border-bottom:0}
.matrix th{font:600 13px/1.3 var(--f-display);color:var(--muted)}
.matrix td button{all:unset;cursor:pointer;display:block;font-size:13.5px;line-height:1.45;padding:2px 0}
.matrix td button:hover{text-decoration:underline}
.matrix td button:focus-visible{outline:2px solid var(--accent)}

/* site window */
.site-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.site-head h1{font-size:clamp(28px,4vw,42px)}
.site-head .loc{color:var(--muted);margin-top:4px}
.site-head .tag{max-width:46ch;color:var(--muted);font-size:14px}
.site-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.viewer{background:var(--scene);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.vbar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 14px;font:600 13px/1.4 var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:13px}
.stage{position:relative;aspect-ratio:4/3;max-width:100%;min-height:300px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:6px;pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 10px;font-size:12.5px;color:var(--muted);background:var(--surface);border-top:1px solid var(--line)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}

.plist{display:grid;gap:8px}
.pitem{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.pitem:hover{border-color:var(--accent)}
.pitem:focus-visible{outline:2px solid var(--accent)}
.pitem[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 13px/1 var(--f-mono)}
.pitem h3{font:600 15px/1.35 var(--f-body)}
.pitem p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px}
.facts div{background:var(--surface);padding:12px 14px;min-width:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,20,25,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);z-index:41;border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.dr-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dr-b{overflow-y:auto;padding:18px 18px 28px;display:grid;gap:16px;align-content:start}
.dr-b h2{font-size:24px}
.dr-b h4{margin:0 0 6px;font:600 13px/1.3 var(--f-display);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.dr-b ul{margin:0;padding-left:20px;display:grid;gap:4px}
.dr-b p{margin:0}
.dr-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;text-decoration:none;display:inline-block}

/* challenge window */
.ch-hero{border-radius:14px;padding:26px 24px;color:#fff;margin-bottom:22px;display:grid;gap:10px}
.ch-hero h1{font-size:clamp(30px,5vw,48px)}
.ch-hero p{margin:0;max-width:70ch;opacity:.95}
.ch-hero ul{margin:0;padding-left:20px}
.ch-group{margin-bottom:22px}
.ch-group h3{font-size:18px;margin-bottom:8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ch-group h3 a{font:500 13px var(--f-body)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* apply */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0 26px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;align-content:start}
.step .eyebrow{color:var(--accent)}
.step h3{font-size:17px}
.step p,.step ul{margin:0;font-size:14px;color:var(--muted)}
.step ul{padding-left:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-size:18px;margin-bottom:8px}
.panel ul{margin:0;padding-left:20px;display:grid;gap:4px}
.count{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums}


/* location + news */
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px;margin-top:22px;align-items:start}
.locbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.locbox svg{display:block;width:100%;height:auto;background:var(--sea);max-height:440px}
.locmeta{padding:12px 14px;display:grid;gap:8px;border-top:1px solid var(--line)}
.coord{font:500 13px/1.4 var(--f-mono);font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn2{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 11px;font-size:13px;text-decoration:none;white-space:nowrap}
.btn2:hover{border-color:var(--accent)}
.newslist{display:grid;gap:8px}
.news{display:grid;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink)}
.news:hover{border-color:var(--accent)}
.news .meta{font:500 12px/1.3 var(--f-mono);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.news b{font-weight:600;font-size:14.5px;line-height:1.45}
.news span.sum{font-size:13px;color:var(--muted);line-height:1.5}
.news .site{color:var(--accent)}
.basis{font-size:11.5px;border-radius:4px;padding:1px 7px;color:#fff;white-space:nowrap;display:inline-block}
.mapwrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start;margin:0 0 30px}
.pinlbl{font:600 3.2px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:.9px}
@media (max-width:820px){.lower,.mapwrap{grid-template-columns:1fr}}

/* proposal workspace */
.prog{min-width:200px;display:grid;gap:4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.sync{font-size:12px;color:var(--muted)}.sync[data-mode="shared"]{color:var(--ok)}.sync[data-mode="offline"]{color:var(--part)}
.pgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.pside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:12px;max-height:calc(100vh - 90px);overflow-y:auto}
.pside .panel{padding:14px}.pside h3{font-size:15px;margin-bottom:6px}
select,input[type=text],textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;line-height:1.6}
select:focus,input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.fl{display:block;font:600 13px/1.4 var(--f-body);margin:10px 0 5px}
.muted-s{font-size:13px;color:var(--muted);margin:8px 0 0}
.qnav{display:grid;gap:2px;padding:8px!important}
.qnav a{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:13px;line-height:1.35}
.qnav a:hover{background:var(--paper)}
.qn{font:600 12px/1 var(--f-mono);color:var(--accent)}
.qs{font:500 11.5px var(--f-mono);color:var(--muted)}.qs[data-ok="true"]{color:var(--ok)}
.qlist{display:grid;gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;scroll-margin-top:80px}
.qcard header{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.qn.big{font-size:15px;padding-top:4px}
.qcard h2{font-size:19px}.qcard header p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.req{font-size:11.5px;border-radius:4px;padding:2px 7px;background:var(--ink);color:var(--paper);white-space:nowrap}.req.opt{background:transparent;color:var(--muted);border:1px solid var(--line)}
.fmeta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.tips{margin:0;padding:10px 12px 10px 28px;background:var(--paper);border-radius:8px;font-size:13px;color:var(--muted);display:grid;gap:3px}
.sugg{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
.sugg:empty{display:none}
.link{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;text-decoration:underline}
.stages{display:grid;gap:6px}
.stage{display:grid;grid-template-columns:auto 28px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.stage:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stage input{margin-top:6px;accent-color:var(--accent)}
.stage .sn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font:600 12px var(--f-mono)}
.stage b{display:block;font-size:14px}.stage span span{display:block;font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.chk{display:grid;gap:6px}.chk label{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--line)}
.chk input{margin-top:5px;accent-color:var(--accent)}
.ctxcard{display:grid;gap:8px;background:var(--paper);border-radius:8px;padding:12px}
.minifacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:4px 0 0;font-size:12.5px}.minifacts dt{color:var(--muted)}.minifacts dd{margin:0}
.citebox{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--paper);border-radius:8px;padding:10px}.citebox .eyebrow{width:100%}
.btn2.cite{cursor:pointer;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;z-index:60;font-size:14px}
@media (max-width:900px){.pgrid{grid-template-columns:1fr}.pside{position:static;max-height:none}}

/* stepper, picker, esg, terms */
.stepper{display:flex;gap:6px;overflow-x:auto;margin:0 0 18px;padding-bottom:2px;scrollbar-width:thin}
.stepper a{display:flex;gap:8px;align-items:center;white-space:nowrap;text-decoration:none;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font-size:13.5px}
.stepper a .sn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font:600 12px var(--f-mono)}
.stepper a[aria-current="step"]{color:var(--ink);border-color:var(--ink)}.stepper a[aria-current="step"] .sn{background:var(--ink);color:var(--paper)}
.guide{margin:0;padding-left:22px;display:grid;gap:8px}.guide li span{display:block;font-size:13px;color:var(--muted)}
.want{list-style:none;margin:0;padding:0;display:grid;gap:6px}.want li{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:6px}.want .ref{font:500 12px var(--f-mono);color:var(--accent);white-space:nowrap}
.arow{display:flex;gap:10px;flex-wrap:wrap}.arow>div{flex:1;min-width:160px}
.addidea{margin-bottom:12px}
.ideas{display:grid;gap:12px}
.empty{display:grid;gap:4px;text-align:center;padding:26px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}.empty b{color:var(--ink)}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.idea header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.idea h3{font-size:18px;margin-top:6px}
.score{text-align:right}.score b{display:block;font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}.score span{font-size:12px;color:var(--muted)}
.crit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.crit label{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--paper);border-radius:8px;padding:8px 10px;font-size:13.5px}
.crit small{display:block;font:500 11px var(--f-mono);color:var(--muted)}.crit select{width:auto;padding:4px 6px}
.idea footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.esg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:16px 0 14px;align-items:start}
.esgchk label span b{display:block;font-weight:600}.esgchk small{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.chk label.other{grid-template-columns:auto 1fr;align-items:center;border-bottom:0}
.sdgs{background:var(--paper);border-radius:8px;padding:10px;display:grid;gap:8px}.sdgs>div{display:flex;flex-wrap:wrap;gap:6px}
.sdg{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12.5px}.sdg b{font:600 12px var(--f-mono);color:var(--accent)}
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.timeline>div{background:var(--paper);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
table.mem td,table.mem th{text-align:center}table.mem td:first-child,table.mem th:first-child{text-align:left}
.mem input{accent-color:var(--accent);width:18px;height:18px}
.confirm{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border-radius:8px;padding:12px;font-weight:500}.confirm input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}.confirm small{font-weight:400;color:var(--muted)}
.terms{display:grid;gap:8px}
.term{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.term summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none}.term summary::-webkit-details-marker{display:none}
.term summary::after{content:'+';margin-left:auto;color:var(--muted);font:600 16px var(--f-mono)}.term[open] summary::after{content:'–'}
.term input{accent-color:var(--accent);width:18px;height:18px}.term ul{margin:10px 0;padding-left:22px;display:grid;gap:4px;font-size:14px}
@media (max-width:1000px){.esg3{grid-template-columns:1fr}.crit{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.crit,.timeline{grid-template-columns:1fr}}
@media (max-width:1000px){.sites{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.hero,.site-grid,.two{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media (max-width:520px){.sites,.steps{grid-template-columns:1fr}.brand small{display:none}.stats b{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
